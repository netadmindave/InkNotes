[package]
name = "inkcore"
version = "0.1.0"
edition = "2021"
description = "InkNotes engine: ink geometry, shapes, eraser, selection, handwriting layout analysis, math and text clean-up"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", default-features = false }
spellbook = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
tract-onnx = { version = "0.23", optional = true }
anyhow = { version = "1", optional = true }

[features]
default = ["inkmath"]
inkmath = ["dep:tract-onnx", "dep:anyhow"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
