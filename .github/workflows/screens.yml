name: Screenshot check (tablet emulator)

on:
  push:
    branches: [ v2-rust ]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Rust for emulator (x86_64)
        run: |
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Build engine
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t x86_64 --platform 29 -o ../app2/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build debug APK
        env: { ABIS: x86_64 }
        run: gradle --no-daemon :app2:assembleDebug
      - name: Run on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots/
