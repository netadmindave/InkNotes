name: Build InkNotes 2

on:
  push:
    branches: [ v2-rust ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust toolchain + Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Test engine
        working-directory: core
        run: cargo test --release

      - name: Build engine for arm64
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 29 -o ../app2/src/main/jniLibs build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app2:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app2/build/outputs/apk/release/app2-release.apk out/InkNotes-2.0.${{ github.run_number }}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: InkNotes-native-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          target_commitish: v2-rust
          name: InkNotes 2.0.${{ github.run_number }} (native)
          files: out/*.apk
          prerelease: true
          make_latest: false
