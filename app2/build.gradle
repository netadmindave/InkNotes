plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.netadmindave.inknotes2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.netadmindave.inknotes2'
        minSdk 29
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "2.0." + (System.getenv('VERSION_CODE') ?: '0')
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file('../keystore/inknotes.jks')
            storePassword 'inknotes'
            keyAlias 'inknotes'
            keyPassword 'inknotes'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    packagingOptions { jniLibs { useLegacyPackaging false } }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
    // on-device handwriting recognition (model downloaded once, then offline)
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'
    // native LaTeX rendering for formulas
    implementation 'ru.noties:jlatexmath-android:0.2.0'
}
