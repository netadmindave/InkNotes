<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="stylesheet" href="mathlive/mathlive-fonts.css">
<link rel="stylesheet" href="mathlive/mathlive-static.css">
<style>
  html, body { margin: 0; padding: 0; background: #FBF8F1; height: 100%; overflow-y: auto; font-family: sans-serif; }
  #wrap { padding: 10px 12px 0; }
  math-field { display: block; width: 100%; box-sizing: border-box; font-size: 30px; min-height: 64px; padding: 8px 10px;
    border: 1.5px solid #c9bfa8; border-radius: 10px; background: #fff; color: #1d3557;
    --caret-color: #5B2A6E; --selection-background-color: #e8dcf2; --contains-highlight-background-color: #f3eef8; --placeholder-color: #b9aec9; }
  math-field:focus-within { outline: none; border-color: #5B2A6E; }
  math-field::part(virtual-keyboard-toggle), math-field::part(menu-toggle) { display: none; }
  #bar { display: flex; gap: 6px; padding: 6px 12px; }
  #bar button { flex: 0 0 auto; font-size: 15px; padding: 6px 12px; border: 1px solid #d8d0bd; background: #fff; border-radius: 8px; color: #333; }
  #bar button.on { background: #dccfea; }
  #pad { padding: 4px 10px 10px; }
  #tabs { display: flex; gap: 6px; margin: 4px 0 6px; }
  #tabs button { flex: 1; font-size: 15px; padding: 7px 0; border: 1px solid #d8d0bd; background: #fff; border-radius: 8px; color: #333; }
  #tabs button.on { background: #5B2A6E; color: #fff; border-color: #5B2A6E; }
  #keys { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  #keys button { font-size: 20px; padding: 10px 0; border: 1px solid #d8d0bd; background: #fff; border-radius: 8px; color: #1d3557;
    font-family: KaTeX_Main, serif; touch-action: manipulation; }
  #keys button.op { background: #f3eef8; }
  #keys button:active { background: #dccfea; }
</style></head>
<body>
<div id="wrap"><math-field id="mf" math-virtual-keyboard-policy="manual"></math-field></div>
<div id="bar">
  <button id="left">◀</button><button id="right">▶</button><button id="del">⌫</button><button id="clear">Clear</button>
  <span style="flex:1"></span><button id="abc">ABC keyboard</button>
</div>
<div id="pad"><div id="tabs"></div><div id="keys"></div></div>
<script src="mathlive/mathlive.min.js"></script>
<script>
  try { MathfieldElement.soundsDirectory = null; MathfieldElement.plonkSound = null; MathfieldElement.keypressSound = null; } catch (e) {}
  const mf = document.getElementById('mf');
  // never show MathLive's own pop-up keyboard: the keypad below replaces it
  function noVk() {
    try {
      const vk = window.mathVirtualKeyboard;
      if (vk && !vk.__off) { vk.hide(); vk.show = () => {}; vk.__off = true; }
      else if (vk) vk.hide();
    } catch (e) {}
  }
  noVk();
  let os = false;
  function sink(on) {
    try {
      const s = mf.shadowRoot && (mf.shadowRoot.querySelector('[part=keyboard-sink]') || mf.shadowRoot.querySelector('.ML__keyboard-sink') || mf.shadowRoot.querySelector('textarea'));
      if (s) s.setAttribute('inputmode', on ? 'text' : 'none');
    } catch (e) {}
  }
  function latex() {
    let v = '';
    try { v = mf.getValue('latex-expanded'); } catch (e) { v = mf.value; }
    return v;
  }
  function send() { try { Bridge.input(latex()); } catch (e) {} }
  function setup() {
    try {
      mf.mathVirtualKeyboardPolicy = 'manual';
      mf.smartFence = true; mf.smartSuperscript = true;
      mf.popoverPolicy = 'off'; mf.menuItems = [];
      mf.inlineShortcutTimeout = 0;
    } catch (e) {}
    sink(false); noVk();
  }
  mf.addEventListener('mount', setup, { once: true });
  mf.addEventListener('input', send);
  mf.addEventListener('focusin', () => { sink(os); noVk(); setTimeout(() => sink(os), 30); });
  document.getElementById('left').onclick = () => { mf.executeCommand('moveToPreviousChar'); mf.focus(); };
  document.getElementById('right').onclick = () => { mf.executeCommand('moveToNextChar'); mf.focus(); };
  document.getElementById('del').onclick = () => { mf.executeCommand('deleteBackward'); mf.focus(); send(); };
  document.getElementById('clear').onclick = () => { mf.value = ''; mf.focus(); send(); };
  document.getElementById('abc').onclick = (e) => {
    os = !os; e.target.classList.toggle('on', os); sink(os);
    document.getElementById('pad').style.display = os ? 'none' : '';
    mf.blur(); setTimeout(() => mf.focus(), 50);
  };
  // ---- keypad (like CalcShelf): every key inserts LaTeX; #0/#? are boxes to fill, #@ takes what's before the cursor
  const K = (label, tex, op) => ({ label, tex, op });
  const TABS = {
    '123': [
      K('7','7'),K('8','8'),K('9','9'),K('÷','\\div',1),K('(','\\left(#0\\right)',1),K(')',')',1),K('x','x'),K('y','y'),K('z','z'),K('t','t'),
      K('4','4'),K('5','5'),K('6','6'),K('×','\\times',1),K('□/□','\\frac{#0}{#?}',1),K('x<sup>2</sup>','#@^{2}',1),K('x<sup>n</sup>','#@^{#?}',1),K('x<sub>n</sub>','#@_{#?}',1),K('√','\\sqrt{#0}',1),K('ⁿ√','\\sqrt[#?]{#0}',1),
      K('1','1'),K('2','2'),K('3','3'),K('−','-',1),K('=','=',1),K('<','<',1),K('>','>',1),K('≤','\\le',1),K('≥','\\ge',1),K('≠','\\ne',1),
      K('0','0'),K('.','.'),K(',',','),K('+','+',1),K('±','\\pm',1),K('π','\\pi'),K('e','e'),K('∞','\\infty'),K('·','\\cdot',1),K('≈','\\approx',1)],
    'f(x)': [
      K('sin','\\sin'),K('cos','\\cos'),K('tan','\\tan'),K('ln','\\ln'),K('log','\\log'),K('exp','\\exp'),K('|x|','\\left|#0\\right|',1),K('[ ]','\\left[#0\\right]',1),K('{ }','\\left\\{#0\\right\\}',1),K('°','^{\\circ}',1),
      K('∫','\\int',1),K('∫ₐᵇ','\\int_{#?}^{#?}',1),K('∮','\\oint',1),K('∑','\\sum_{#?}^{#?}',1),K('∏','\\prod_{#?}^{#?}',1),K('lim','\\lim_{#?\\to#?}',1),K('d/dx','\\frac{d}{d#?}',1),K('∂','\\partial'),K('∇','\\nabla'),K('dx','\\,dx'),
      K('→','\\to',1),K('⇒','\\Rightarrow',1),K('∝','\\propto',1),K('∈','\\in',1),K('∀','\\forall'),K('∃','\\exists'),K('′',"'",1),K('!','!',1),K('%','\\%',1),K('ℏ','\\hbar'),
      K('x̄','\\overline{#0}',1),K('x̂','\\hat{#0}',1),K('x⃗','\\vec{#0}',1),K('ẋ','\\dot{#0}',1),K('×10ⁿ','\\times10^{#0}',1),K('Δ','\\Delta'),K('∠','\\angle'),K('⊥','\\perp'),K('∥','\\parallel'),K('⋯','\\cdots')],
    'αβγ': ['alpha','beta','gamma','delta','epsilon','zeta','eta','theta','iota','kappa','lambda','mu','nu','xi','pi','rho','sigma','tau','upsilon','phi',
      'chi','psi','omega','varepsilon','vartheta','varphi','Gamma','Delta','Theta','Lambda','Xi','Pi','Sigma','Phi','Psi','Omega'].map(g => K(null, '\\' + g)),
    'abc': 'abcdefghijklmnopqrstuvwxyz'.split('').map(c => K(c, c)),
    'ABC': 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => K(c, c)),
  };
  const GREEK = { alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ϵ',zeta:'ζ',eta:'η',theta:'θ',iota:'ι',kappa:'κ',lambda:'λ',mu:'μ',nu:'ν',xi:'ξ',pi:'π',rho:'ρ',
    sigma:'σ',tau:'τ',upsilon:'υ',phi:'ϕ',chi:'χ',psi:'ψ',omega:'ω',varepsilon:'ε',vartheta:'ϑ',varphi:'φ',Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Xi:'Ξ',Pi:'Π',Sigma:'Σ',Phi:'Φ',Psi:'Ψ',Omega:'Ω' };
  const tabsEl = document.getElementById('tabs'), keysEl = document.getElementById('keys');
  function put(tex) {
    try { mf.executeCommand(['insert', tex, { format: 'latex', insertionMode: 'replaceSelection', selectionMode: 'placeholder', focus: true }]); } catch (e) { mf.insert(tex); }
    mf.focus(); send();
  }
  function show(name) {
    [...tabsEl.children].forEach(b => b.classList.toggle('on', b.textContent === name));
    keysEl.innerHTML = '';
    for (const k of TABS[name]) {
      const b = document.createElement('button');
      if (k.label && k.label.includes('<')) b.innerHTML = k.label; else b.textContent = k.label || GREEK[k.tex.slice(1)] || k.tex;
      if (k.op) b.className = 'op';
      // pointerdown + preventDefault keeps the cursor in the formula
      b.addEventListener('pointerdown', ev => { ev.preventDefault(); put(k.tex); });
      keysEl.appendChild(b);
    }
  }
  for (const name of Object.keys(TABS)) {
    const b = document.createElement('button'); b.textContent = name;
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); show(name); mf.focus(); });
    tabsEl.appendChild(b);
  }
  show('123');
  for (const id of ['left', 'right', 'del', 'clear', 'abc']) {
    const el = document.getElementById(id); el.addEventListener('pointerdown', ev => ev.preventDefault());
  }
  // called from the app
  window.setValue = (tex) => { mf.value = tex || ''; setTimeout(() => { mf.focus(); try { mf.executeCommand('moveToMathfieldEnd'); } catch (e) {} ; send(); }, 60); };
  window.addEventListener('load', () => { try { Bridge.ready(); } catch (e) {} });
</script>
</body></html>
